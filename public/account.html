<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حساب کاربری | آوان گالری</title>
<meta name="theme-color" content="#061a25">
<link rel="icon" type="image/png" href="assets/favicon-avan.png">
<link rel="stylesheet" href="login.css">
<style>
body{background:radial-gradient(circle at 20% 10%,rgba(216,182,90,.13),transparent 28%),radial-gradient(circle at 80% 90%,rgba(22,79,105,.32),transparent 35%),#061a25;min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.account-card{width:min(980px,100%);background:rgba(6,27,39,.94);border:1px solid rgba(216,182,90,.28);border-radius:28px;padding:38px;box-shadow:0 30px 80px rgba(0,0,0,.38);color:#f5f8fa;text-align:center}
.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid #d8b65a;background:#0b2a3a;margin-bottom:16px}
.avatar-fallback{display:grid;place-items:center;font-size:34px;font-weight:800;color:#d8b65a}
h1{margin:0 0 8px;font-size:26px}.email{color:#a9c0cb;margin:0 0 28px;direction:ltr;unicode-bidi:isolate}.badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:rgba(216,182,90,.1);border:1px solid rgba(216,182,90,.25);color:#e5c86e;font-size:12px;margin-bottom:24px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.actions a,.actions button{min-width:180px;height:48px;border-radius:13px;border:1px solid rgba(216,182,90,.35);background:#0a2432;color:#fff;text-decoration:none;font:700 14px Vazirmatn;cursor:pointer}.actions a.primary{background:linear-gradient(135deg,#e7c35e,#b89232);color:#08151d;border:0;display:grid;place-items:center}.state{color:#a9c0cb;margin:0 0 20px}.orders-section{margin-top:30px;text-align:right;border-top:1px solid rgba(216,182,90,.2);padding-top:24px}.orders-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.orders-head h2{margin:0;font-size:20px}.orders-grid{display:grid;gap:14px;margin-top:16px}.order-card{border:1px solid rgba(216,182,90,.22);border-radius:18px;background:linear-gradient(145deg,rgba(10,38,52,.9),rgba(5,24,35,.95));padding:18px;text-align:right}.order-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.order-number{color:#e7c35e;font-weight:800;direction:ltr}.order-meta{color:#a9c0cb;font-size:12px;margin-top:6px}.order-badges{display:flex;gap:7px;flex-wrap:wrap}.order-pill{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:12px;border:1px solid rgba(216,182,90,.22);color:#e7c35e;background:rgba(216,182,90,.08)}.order-pill.paid{color:#8ce3b1;border-color:rgba(80,200,130,.3);background:rgba(80,200,130,.08)}.order-pill.rejected{color:#ffaaaa;border-color:rgba(255,100,100,.3);background:rgba(255,100,100,.08)}.order-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}.order-item{display:flex;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:9px;background:rgba(0,0,0,.12)}.order-item img{width:56px;height:56px;object-fit:contain;border-radius:9px;background:#fff}.order-item b{display:block;font-size:13px}.order-item small{display:block;color:#a9c0cb;margin-top:4px}.order-total{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)}.order-empty{padding:22px;border:1px dashed rgba(216,182,90,.28);border-radius:14px;color:#a9c0cb;text-align:center}.tracking-line{font-size:12px;color:#9ec4d3;margin-top:8px;direction:rtl}.orders-refresh{border:1px solid rgba(216,182,90,.35);background:#0a2432;color:#f3d477;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}.error{color:#ff9a9a}.loading{color:#d8b65a}
@media(max-width:560px){.account-card{padding:28px 20px;border-radius:22px}h1{font-size:22px}.actions{flex-direction:column}.actions a,.actions button{width:100%}}
</style>
</head>
<body>
<main class="account-card" id="accountCard">
  <div class="loading" id="loading">در حال بررسی حساب کاربری...</div>
</main>
<script>
const card=document.getElementById('accountCard');
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function money(v){return new Intl.NumberFormat('fa-IR').format(Number(v)||0)+' تومان';}
function dateFa(v){try{let s=String(v||'').trim();if(!/[zZ]|[+-]\\d{2}:?\\d{2}$/.test(s))s=s.replace(' ','T')+'Z';return new Date(s).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'});}catch(_){return '—';}}
function payInfo(v){
 const x=String(v||'pending').toLowerCase();
 if(['paid','success','succeeded','verified','approved'].includes(x))return ['پرداخت‌شده','paid'];
 if(['failed','rejected','declined','cancelled'].includes(x))return ['پرداخت رد شده','rejected'];
 if(['submitted','awaiting_verification','pending_verification'].includes(x))return ['رسید در انتظار بررسی',''];
 return ['پرداخت‌نشده',''];
}
function orderInfo(v){
 const m={pending_payment:'در انتظار پرداخت',awaiting_verification:'در انتظار بررسی پرداخت',processing:'در حال آماده‌سازی',shipped:'ارسال شده',delivered:'تحویل شده',cancelled:'لغو شده'};
 return m[v]||'در حال پردازش';
}
async function loadOrders(){
 const box=document.getElementById('ordersGrid'); if(!box)return;
 box.innerHTML='<div class="order-empty">در حال دریافت سفارش‌ها…</div>';
 try{
  const r=await fetch('/api/account/orders',{cache:'no-store'}),d=await r.json();
  if(!r.ok)throw new Error(d.error||'دریافت سفارش‌ها ناموفق بود.');
  const orders=d.orders||[];
  if(!orders.length){box.innerHTML='<div class="order-empty">هنوز سفارشی برای این حساب ثبت نشده است.</div>';return;}
  box.innerHTML=orders.map(o=>{
   const p=payInfo(o.payment_status);
   const items=(o.items||[]).map(i=>`<div class="order-item">${i.image?`<img src="${esc(i.image)}" alt="${esc(i.name)}" loading="lazy" onerror="this.style.display='none'">`:`<div style="width:56px;height:56px;border-radius:9px;background:#0b2b3b;display:grid;place-items:center;color:#d8b65a">⌚</div>`}<div><b>${esc(i.name||'محصول آوان')}</b><small>${new Intl.NumberFormat('fa-IR').format(i.quantity||1)} عدد × ${money(i.price||0)}</small></div></div>`).join('');
   return `<article class="order-card"><div class="order-top"><div><div class="order-number">سفارش #${esc(o.id)}</div><div class="order-meta">${dateFa(o.created_at)}</div></div><div class="order-badges"><span class="order-pill ${p[1]}">${p[0]}</span><span class="order-pill">${orderInfo(o.order_status)}</span></div></div><div class="order-items">${items||'<div class="order-empty">جزئیات محصول در دسترس نیست.</div>'}</div><div class="order-total"><span>مبلغ سفارش</span><b style="color:#f0cc67">${money(o.total)}</b></div>${o.tracking_code?`<div class="tracking-line">کد رهگیری مرسوله: <b dir="ltr">${esc(o.tracking_code)}</b></div>`:''}</article>`;
  }).join('');
 }catch(e){box.innerHTML=`<div class="order-empty error">${esc(e.message)}<br><button class="orders-refresh" id="retryOrders" style="margin-top:12px">تلاش دوباره</button></div>`;document.getElementById('retryOrders')?.addEventListener('click',loadOrders);}
}
async function load(){
 try{
  const r=await fetch('/api/auth/me',{cache:'no-store'}),d=await r.json();
  if(!d.authenticated){location.href='login.html';return;}
  const u=d.user||{}, initial=esc((u.name||'آ').trim().charAt(0));
  card.innerHTML=`${u.avatar?`<img class="avatar" src="${esc(u.avatar)}" alt="تصویر پروفایل">`:`<div class="avatar avatar-fallback">${initial}</div>`}<div class="badge">${u.provider==='google'?'ورود با حساب Google':'حساب کاربری آوان گالری'}</div><h1>${esc(u.name||'کاربر آوان گالری')}</h1><p class="email">${esc(u.email||'')}</p><p class="state">حساب شما با موفقیت به آوان گالری متصل شده است.</p><div class="actions"><a class="primary" href="/">بازگشت به فروشگاه</a><button id="logout" type="button">خروج از حساب</button></div><section class="orders-section"><div class="orders-head"><h2>سفارش‌های من</h2><button id="refreshOrders" class="orders-refresh" type="button">↻ بروزرسانی</button></div><div id="ordersGrid" class="orders-grid"><div class="order-empty">در حال دریافت سفارش‌ها…</div></div></section>`;
  document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='login.html';};
  document.getElementById('refreshOrders').onclick=loadOrders;
  await loadOrders();
 }catch(e){card.innerHTML='<p class="error">خطا در دریافت اطلاعات حساب. دوباره تلاش کنید.</p><div class="actions"><a class="primary" href="/login.html">بازگشت به ورود</a></div>';}
}
load();
</script>
</body>
</html>

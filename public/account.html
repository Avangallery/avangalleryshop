<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب من | آوان گالری</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/"><b>آوان</b><small>AVAN GALLERY</small></a><nav><a href="/">فروشگاه</a><a href="/#products">محصولات</a></nav></header><main class="section account"><div class="accountNav"><button onclick="show('profile')">پروفایل</button><button onclick="show('orders')">سفارش‌های من</button><button onclick="show('addresses')">آدرس‌ها</button><button onclick="logout()">خروج</button></div><div id="panel"></div></main><script>
const fa=n=>Number(n||0).toLocaleString("fa-IR"),money=n=>fa(n)+" تومان";let me;
async function api(p,o={}){const r=await fetch(p,{...o,headers:{"content-type":"application/json"}});const d=await r.json();if(!r.ok)throw Error(d.error||"خطا");return d}
async function init(){me=(await api("/api/auth/me")).user;if(!me)return location.href="/";show("profile")}
async function show(x){if(x==="profile")panel.innerHTML='<div class="box static"><h2>پروفایل</h2><div class="form"><input id="pn" value="'+me.name+'"><input id="pe" value="'+(me.email||"")+'" placeholder="ایمیل"><input value="'+me.phone+'" disabled><button class="pay" onclick="saveProfile()">ذخیره</button></div></div>';if(x==="orders"){const a=await api("/api/orders");panel.innerHTML='<div class="box static"><h2>سفارش‌های من</h2>'+ (a.length?a.map(o=>'<div class="order"><b>'+o.order_number+'</b><span>'+money(o.total)+'</span><span>'+o.status+'</span><a href="/order.html?id='+o.id+'">جزئیات ←</a></div>').join(""):'<p class="muted">هنوز سفارشی ثبت نشده.</p>')+'</div>'}if(x==="addresses"){const a=await api("/api/addresses");panel.innerHTML='<div class="box static"><h2>آدرس‌های من</h2>'+a.map(o=>'<div class="order"><b>'+o.title+'</b><span>'+o.city+'، '+o.address+'</span><button onclick="delAddress('+o.id+')">حذف</button></div>').join("")+'<button class="pay" onclick="addressForm()">+ افزودن آدرس</button></div>'}}
async function saveProfile(){await api("/api/profile",{method:"PATCH",body:JSON.stringify({name:pn.value,email:pe.value})});me.name=pn.value;me.email=pe.value;alert("ذخیره شد")}
function addressForm(){panel.insertAdjacentHTML("beforeend",'<div class="box"><h3>آدرس جدید</h3><div class="form"><input id="ar" placeholder="نام گیرنده"><input id="aph" placeholder="شماره تماس"><input id="apr" placeholder="استان"><input id="aci" placeholder="شهر"><textarea id="aad" placeholder="آدرس کامل"></textarea><input id="apo" placeholder="کد پستی"><button class="pay" onclick="saveAddress()">ذخیره</button></div></div>')}
async function saveAddress(){await api("/api/addresses",{method:"POST",body:JSON.stringify({receiver:ar.value,phone:aph.value,province:apr.value,city:aci.value,address:aad.value,postalCode:apo.value})});show("addresses")}
async function delAddress(id){await api("/api/addresses/"+id,{method:"DELETE"});show("addresses")}
async function logout(){await api("/api/auth/logout",{method:"POST"});location.href="/"}init();
</script></body></html>

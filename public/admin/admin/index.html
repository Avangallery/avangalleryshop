<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود مدیریت | AVAN GALLERY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Vazirmatn,Tahoma,sans-serif;background:#0b2340;color:#ffffff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 20%,rgba(11,35,64,.35),transparent 42%),#0b2340}.login-wrap{width:min(430px,calc(100% - 32px));padding:34px;border:1px solid rgba(255,255,255,.25);border-radius:24px;background:linear-gradient(145deg,rgba(11,35,64,.98),rgba(11,35,64,.98));box-shadow:0 30px 80px rgba(11,35,64,.4);text-align:center}.logo{width:74px;height:74px;border-radius:50%;object-fit:contain;border:1px solid rgba(255,255,255,.5);padding:5px;margin-bottom:16px;background:#0b2340}.brand{font-size:22px;font-weight:800}.sub{color:#ffffff;letter-spacing:2px;font-size:11px;margin-top:3px}.title{font-size:20px;margin:28px 0 8px}.hint{font-size:13px;color:#ffffff;margin:0 0 20px}.field{position:relative}.field input{width:100%;height:52px;border-radius:13px;border:1px solid #0b2340;background:#0b2340;color:#ffffff;padding:0 16px;font:inherit;outline:none;text-align:center;letter-spacing:2px}.field input:focus{border-color:#ffffff;box-shadow:0 0 0 3px rgba(255,255,255,.1)}button{width:100%;height:52px;border:0;border-radius:13px;margin-top:14px;background:linear-gradient(135deg,#ffffff,#ffffff);color:#0b2340;font:800 15px Vazirmatn;cursor:pointer}button:hover{filter:brightness(1.06)}.error{min-height:22px;color:#ffffff;font-size:12px;margin-top:12px}.back{display:inline-block;margin-top:18px;color:#ffffff;text-decoration:none;font-size:12px}.back:hover{color:#ffffff}@media(max-width:480px){.login-wrap{padding:26px 20px}}
</style>

<!-- AVAN V146 contrast fix -->
<style id="avan-v146-contrast-fix">
/* AVAN GALLERY V146 — restore strong control contrast; white + navy only */
:root{--avan-navy:#0b2340;--avan-white:#fff;--avan-border:#000814;--line:#000814;--line2:#000814;--gold:#fff;--gold2:#fff;--gold-2:#fff;--success:#fff;--danger:#fff;color-scheme:dark}
html,body{scrollbar-color:#000814 #0b2340}
/* Cards and field groups get a clear near-black navy outline */
.card,.panel,.form-card,.checkout-card,.account-card,.admin-card,.modal-content,.style-card,.product-card,.cart-card,.payment,.payment-card,.order-card,.dashboard-card,.settings-card,.section-card{border-color:#000814!important;}
/* Form fields must never blend into their surrounding navy background */
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),select,textarea,
.field input,.field textarea,.form-control,.form-input,.search-input{
  background:#fff!important;color:#0b2340!important;border:2px solid #000814!important;
  box-shadow:none!important;caret-color:#0b2340!important;outline-offset:2px;
}
input::placeholder,textarea::placeholder,.field input::placeholder,.field textarea::placeholder{color:#0b2340!important;opacity:.72!important}
input:focus,select:focus,textarea:focus,.field input:focus,.field textarea:focus{border-color:#000814!important;outline:2px solid #0b2340!important;outline-offset:1px!important;box-shadow:0 0 0 2px #fff!important}
/* Clickable controls: legible contrast and a visible dark outline */
button,.btn,.button,[role="button"],input[type="submit"],input[type="button"],.back,.nav-link,.menu-link{
  border-color:#000814!important;outline-offset:2px;
}
button:not(.icon-button):not(.menu-toggle),.btn,input[type="submit"],input[type="button"]{
  box-shadow:none!important;
}
button:focus-visible,.btn:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid #000814!important;outline-offset:3px!important}
/* Primary actions stay navy with white text; white controls stay white with navy text */
.btn,.primary-btn,.checkout-btn,.submit-btn,.add-to-cart,.buy-now,.admin-primary,.button-primary{
  background:#0b2340!important;color:#fff!important;border:2px solid #000814!important;
}
.btn:hover,.primary-btn:hover,.checkout-btn:hover,.submit-btn:hover,.add-to-cart:hover,.buy-now:hover,.admin-primary:hover,.button-primary:hover{
  background:#fff!important;color:#0b2340!important;border-color:#000814!important;
}
/* Keep nav and utility buttons legible without introducing another color */
header button,nav button,.header-actions button,.nav-actions button,.back,.outline-btn,.secondary-btn{
  border:1px solid #000814!important;
}
hr,.divider,.section-divider{border-color:#000814!important;background-color:#000814!important}
::selection{background:#0b2340!important;color:#fff!important}
</style>
</head>
<body>
<main class="login-wrap">
  <img class="logo" src="../assets/avan-mark-clean.png" alt="AVAN GALLERY">
  <div class="brand">آوان گالری</div>
  <div class="sub">AVAN GALLERY</div>
  <h1 class="title">ورود به پنل مدیریت</h1>
  <p class="hint">برای ورود، رمز مدیریت را وارد کنید.</p>
  <form id="loginForm" autocomplete="off">
    <div class="field"><input id="password" type="password" placeholder="رمز مدیریت" aria-label="رمز مدیریت" autofocus></div>
    <button type="submit">ورود به پنل</button>
    <div class="error" id="error"></div>
  </form>
  <a class="back" href="../../index.html">← بازگشت به فروشگاه</a>
</main>
<script>
const form=document.getElementById('loginForm');
const input=document.getElementById('password');
const error=document.getElementById('error');
form.addEventListener('submit',e=>{
  e.preventDefault();
  if(input.value==='avan'){
    sessionStorage.setItem('avan_admin_auth','1');
    location.href='/admin/dashboard.html';
  }else{
    error.textContent='رمز واردشده صحیح نیست.';
    input.value='';
    input.focus();
  }
});
</script>
</body>
</html>

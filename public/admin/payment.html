<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرداخت و کارت | AVAN GALLERY</title><link rel="icon" href="/assets/favicon-avan.png"><link rel="stylesheet" href="/admin/admin.css"><style>body{margin:0;background:#0b2340;color:#ffffff;font-family:Vazirmatn,Arial,sans-serif}.wrap{max-width:1180px;margin:40px auto;padding:0 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.back{color:#ffffff;text-decoration:none}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.panel{background:#0b2340;border:1px solid #0b2340;border-radius:22px;padding:24px;box-shadow:0 20px 50px #0b234044}.panel h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:8px;color:#ffffff;font-size:13px}input,textarea,select{box-sizing:border-box;width:100%;background:#0b2340;border:1px solid #0b2340;border-radius:13px;padding:13px;color:#ffffff;font:inherit}textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}.actions{margin-top:20px;display:flex;gap:10px}.btn{border:0;border-radius:13px;padding:13px 20px;background:#ffffff;color:#0b2340;font-weight:800;cursor:pointer}.muted{color:#ffffff;font-size:13px}.preview{background:linear-gradient(145deg,#0b2340,#0b2340);border:1px solid #ffffff;border-radius:20px;padding:25px}.cardnum{font-size:25px;letter-spacing:2px;direction:ltr;text-align:center;margin:30px 0}.ok{color:#ffffff}.err{color:#ffffff}@media(max-width:800px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}}</style>
<!-- AVAN V146 contrast fix -->
<style id="avan-v146-contrast-fix">
/* AVAN GALLERY V146 — restore strong control contrast; white + navy only */
:root{--avan-navy:#0b2340;--avan-white:#fff;--avan-border:#000814;--line:#000814;--line2:#000814;--gold:#fff;--gold2:#fff;--gold-2:#fff;--success:#fff;--danger:#fff;color-scheme:dark}
html,body{scrollbar-color:#000814 #0b2340}
/* Cards and field groups get a clear near-black navy outline */
.card,.panel,.form-card,.checkout-card,.account-card,.admin-card,.modal-content,.style-card,.product-card,.cart-card,.payment,.payment-card,.order-card,.dashboard-card,.settings-card,.section-card{border-color:#000814!important;}
/* Form fields must never blend into their surrounding navy background */
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),select,textarea,
.field input,.field textarea,.form-control,.form-input,.search-input{
  background:#fff!important;color:#0b2340!important;border:2px solid #000814!important;
  box-shadow:none!important;caret-color:#0b2340!important;outline-offset:2px;
}
input::placeholder,textarea::placeholder,.field input::placeholder,.field textarea::placeholder{color:#0b2340!important;opacity:.72!important}
input:focus,select:focus,textarea:focus,.field input:focus,.field textarea:focus{border-color:#000814!important;outline:2px solid #0b2340!important;outline-offset:1px!important;box-shadow:0 0 0 2px #fff!important}
/* Clickable controls: legible contrast and a visible dark outline */
button,.btn,.button,[role="button"],input[type="submit"],input[type="button"],.back,.nav-link,.menu-link{
  border-color:#000814!important;outline-offset:2px;
}
button:not(.icon-button):not(.menu-toggle),.btn,input[type="submit"],input[type="button"]{
  box-shadow:none!important;
}
button:focus-visible,.btn:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid #000814!important;outline-offset:3px!important}
/* Primary actions stay navy with white text; white controls stay white with navy text */
.btn,.primary-btn,.checkout-btn,.submit-btn,.add-to-cart,.buy-now,.admin-primary,.button-primary{
  background:#0b2340!important;color:#fff!important;border:2px solid #000814!important;
}
.btn:hover,.primary-btn:hover,.checkout-btn:hover,.submit-btn:hover,.add-to-cart:hover,.buy-now:hover,.admin-primary:hover,.button-primary:hover{
  background:#fff!important;color:#0b2340!important;border-color:#000814!important;
}
/* Keep nav and utility buttons legible without introducing another color */
header button,nav button,.header-actions button,.nav-actions button,.back,.outline-btn,.secondary-btn{
  border:1px solid #000814!important;
}
hr,.divider,.section-divider{border-color:#000814!important;background-color:#000814!important}
::selection{background:#0b2340!important;color:#fff!important}
</style>
</head><body><main class="wrap"><div class="top"><div><h1>مدیریت پرداخت و کارت</h1><p class="muted">اطلاعات پرداخت کارت‌به‌کارت و تنظیمات درگاه آنلاین</p></div><a class="back" href="/admin/dashboard">← بازگشت به مدیریت</a></div><div class="grid"><section class="panel"><h2>اطلاعات کارت فروشگاه</h2><p class="muted">این اطلاعات در مرحله پرداخت مشتری نمایش داده می‌شود.</p><div class="fields"><label>شماره کارت<input id="cardNumber" dir="ltr" inputmode="numeric" placeholder="6037 0000 0000 0000"></label><label>نام صاحب کارت<input id="cardName" placeholder="نام صاحب حساب / فروشگاه"></label><label>بانک<input id="bankName" placeholder="نام بانک"></label><label>درگاه<select id="gatewayName"><option value="">انتخاب درگاه</option><option value="zarinpal">زرین‌پال</option><option value="idpay">آیدی‌پی</option><option value="nextpay">نکست‌پی</option><option value="custom">سایر</option></select></label><label class="full">توضیحات پرداخت<textarea id="note" placeholder="توضیحات مربوط به کارت‌به‌کارت..."></textarea></label></div><div class="actions"><button class="btn" id="save">ذخیره اطلاعات پرداخت</button><span id="msg" class="muted"></span></div></section><section class="preview"><h2>پیش‌نمایش برای مشتری</h2><p class="muted">کارت پرداخت آوان گالری</p><div id="pvNum" class="cardnum">6037 •••• •••• ••••</div><div><b id="pvName">نام صاحب کارت</b><br><span id="pvBank" class="muted">نام بانک</span></div></section></div></main><script>const $=id=>document.getElementById(id);function sync(){ $('pvNum').textContent=$('cardNumber').value||'6037 •••• •••• ••••';$('pvName').textContent=$('cardName').value||'نام صاحب کارت';$('pvBank').textContent=$('bankName').value||'نام بانک'};['cardNumber','cardName','bankName'].forEach(id=>$(id).addEventListener('input',sync));async function load(){const r=await fetch('/api/admin/payment-settings');const d=await r.json();if(!d.ok){location='/admin';return}const p=d.payment||{};$('cardNumber').value=p.cardNumber||'';$('cardName').value=p.cardName||'';$('bankName').value=p.bankName||'';$('gatewayName').value=p.gatewayName||'';$('note').value=p.note||'';sync()}$('save').onclick=async()=>{const cardDigits=$('cardNumber').value.replace(/\\D/g,'');if(cardDigits && cardDigits.length!==16){$('msg').textContent='شماره کارت باید ۱۶ رقم باشد.';$('msg').className='err';return}if(cardDigits && (!$('cardName').value.trim()||!$('bankName').value.trim())){$('msg').textContent='نام صاحب کارت و بانک را وارد کنید.';$('msg').className='err';return}const b={cardNumber:$('cardNumber').value.replace(/\\s+/g,' ').trim(),cardName:$('cardName').value,bankName:$('bankName').value,gatewayName:$('gatewayName').value,note:$('note').value};const r=await fetch('/api/admin/payment-settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const d=await r.json();$('msg').textContent=d.ok?'✓ ذخیره شد':(d.error||'خطا');$('msg').className=d.ok?'ok':'err'};load();</script></body></html>

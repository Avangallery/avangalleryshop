<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرداخت و کارت | AVAN GALLERY</title><link rel="icon" href="/assets/favicon-avan.png"><link rel="stylesheet" href="/admin/admin.css"><style>body{margin:0;background:#04141c;color:#eef4f7;font-family:Vazirmatn,Arial,sans-serif}.wrap{max-width:1180px;margin:40px auto;padding:0 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.back{color:#f0c85b;text-decoration:none}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.panel{background:#081f2a;border:1px solid #1a4050;border-radius:22px;padding:24px;box-shadow:0 20px 50px #0004}.panel h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:8px;color:#b8cbd3;font-size:13px}input,textarea,select{box-sizing:border-box;width:100%;background:#06161d;border:1px solid #285467;border-radius:13px;padding:13px;color:#fff;font:inherit}textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}.actions{margin-top:20px;display:flex;gap:10px}.btn{border:0;border-radius:13px;padding:13px 20px;background:#efc653;color:#07141b;font-weight:800;cursor:pointer}.muted{color:#8ea7b2;font-size:13px}.preview{background:linear-gradient(145deg,#0b2937,#06151d);border:1px solid #b98c32;border-radius:20px;padding:25px}.cardnum{font-size:25px;letter-spacing:2px;direction:ltr;text-align:center;margin:30px 0}.ok{color:#52e29a}.err{color:#ff8f8f}@media(max-width:800px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="top"><div><h1>مدیریت پرداخت و کارت</h1><p class="muted">اطلاعات پرداخت کارت‌به‌کارت و تنظیمات درگاه آنلاین</p></div><a class="back" href="/admin/dashboard">← بازگشت به مدیریت</a></div><div class="grid"><section class="panel"><h2>اطلاعات کارت فروشگاه</h2><p class="muted">این اطلاعات در مرحله پرداخت مشتری نمایش داده می‌شود.</p><div class="fields"><label>شماره کارت<input id="cardNumber" dir="ltr" inputmode="numeric" placeholder="6037 0000 0000 0000"></label><label>نام صاحب کارت<input id="cardName" placeholder="نام صاحب حساب / فروشگاه"></label><label>بانک<input id="bankName" placeholder="نام بانک"></label><label>درگاه<select id="gatewayName"><option value="">انتخاب درگاه</option><option value="zarinpal">زرین‌پال</option><option value="idpay">آیدی‌پی</option><option value="nextpay">نکست‌پی</option><option value="custom">سایر</option></select></label><label class="full">توضیحات پرداخت<textarea id="note" placeholder="توضیحات مربوط به کارت‌به‌کارت..."></textarea></label></div><div class="actions"><button class="btn" id="save">ذخیره اطلاعات پرداخت</button><span id="msg" class="muted"></span></div></section><section class="preview"><h2>پیش‌نمایش برای مشتری</h2><p class="muted">کارت پرداخت آوان گالری</p><div id="pvNum" class="cardnum">6037 •••• •••• ••••</div><div><b id="pvName">نام صاحب کارت</b><br><span id="pvBank" class="muted">نام بانک</span></div></section></div></main><script>const $=id=>document.getElementById(id);function sync(){ $('pvNum').textContent=$('cardNumber').value||'6037 •••• •••• ••••';$('pvName').textContent=$('cardName').value||'نام صاحب کارت';$('pvBank').textContent=$('bankName').value||'نام بانک'};['cardNumber','cardName','bankName'].forEach(id=>$(id).addEventListener('input',sync));async function load(){const r=await fetch('/api/admin/payment-settings');const d=await r.json();if(!d.ok){location='/admin';return}const p=d.payment||{};$('cardNumber').value=p.cardNumber||'';$('cardName').value=p.cardName||'';$('bankName').value=p.bankName||'';$('gatewayName').value=p.gatewayName||'';$('note').value=p.note||'';sync()}$('save').onclick=async()=>{const b={cardNumber:$('cardNumber').value,cardName:$('cardName').value,bankName:$('bankName').value,gatewayName:$('gatewayName').value,note:$('note').value};const r=await fetch('/api/admin/payment-settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const d=await r.json();$('msg').textContent=d.ok?'✓ ذخیره شد':(d.error||'خطا');$('msg').className=d.ok?'ok':'err'};load();</script></body></html>

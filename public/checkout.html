<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت سفارش | AVAN GALLERY</title><link rel="stylesheet" href="/style.css"><style>
:root{--navy:#061923;--navy2:#0b2634;--gold:#efc96d;--text:#edf3f4;--muted:#9fb0b5;--line:rgba(255,255,255,.09)}body{margin:0;background:radial-gradient(circle at 50% 0,#12394a 0,#061923 46%,#031119 100%);color:var(--text);font-family:Tahoma,Arial,sans-serif}.checkout-wrap{max-width:1180px;margin:0 auto;padding:40px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{color:var(--gold);font-weight:900;letter-spacing:3px}.back{color:#fff;text-decoration:none;border:1px solid var(--line);padding:10px 16px;border-radius:12px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.card{background:rgba(8,29,40,.88);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 50px #0004}.card h2{margin:0 0 18px;font-size:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px}.field input,.field textarea{width:100%;box-sizing:border-box;background:#071b26;border:1px solid #234554;color:#fff;border-radius:12px;padding:13px;outline:none}.field textarea{min-height:100px;resize:vertical}.summary-item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.total{display:flex;justify-content:space-between;padding-top:18px;font-weight:900;font-size:18px}.gold{color:var(--gold)}.btn{width:100%;margin-top:18px;border:0;border-radius:14px;background:var(--gold);color:#09151b;font-weight:900;padding:15px;cursor:pointer}.payment{margin-top:18px;padding:16px;border-radius:16px;background:rgba(239,201,109,.07);border:1px solid rgba(239,201,109,.25)}.payment .num{direction:ltr;text-align:center;font-size:21px;font-weight:900;letter-spacing:2px;margin:10px 0;color:var(--gold)}.hidden{display:none!important}.success{padding:28px;text-align:center}.order-id{direction:ltr;font-weight:900;color:var(--gold);font-size:20px}.step{display:inline-flex;padding:7px 11px;border-radius:999px;background:#102f3e;color:var(--gold);font-size:11px;margin-bottom:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.checkout-wrap{padding:22px 12px 50px}}
</style></head><body><main class="checkout-wrap"><div class="top"><div><div class="brand">AVAN GALLERY</div><h1 style="margin:8px 0 0;font-size:28px">ثبت سفارش</h1></div><a class="back" href="/">← بازگشت به فروشگاه</a></div><div id="app"><div class="grid"><section class="card"><span class="step">مرحله ۱ · اطلاعات ارسال</span><h2>اطلاعات گیرنده</h2><form id="checkoutForm"><div class="fields"><div class="field"><label>نام و نام خانوادگی *</label><input name="name" required></div><div class="field"><label>شماره موبایل *</label><input name="phone" inputmode="tel" required></div><div class="field"><label>ایمیل</label><input name="email" type="email"></div><div class="field"><label>استان *</label><input name="province" required></div><div class="field"><label>شهر *</label><input name="city" required></div><div class="field"><label>کد پستی</label><input name="postalCode" inputmode="numeric"></div><div class="field full"><label>آدرس کامل *</label><textarea name="address" required></textarea></div><div class="field full"><label>توضیحات سفارش</label><textarea name="notes" placeholder="مثلاً زمان مناسب تحویل..."></textarea></div></div><button class="btn" type="submit">ادامه و ثبت سفارش</button></form></section><aside class="card"><span class="step">خلاصه سفارش</span><div id="items"></div><div class="total"><span>مبلغ نهایی</span><strong id="total" class="gold">۰ تومان</strong></div></aside></div><section id="paymentCard" class="card hidden" style="margin-top:20px"><span class="step">مرحله ۲ · پرداخت کارت به کارت</span><h2>پرداخت سفارش</h2><p id="paymentText" style="color:var(--muted);line-height:2">سفارش شما ثبت شد. مبلغ را به کارت زیر واریز کنید، سپس کد پیگیری تراکنش را وارد کنید.</p><div class="payment"><div>شماره کارت</div><div id="cardNumber" class="num">در انتظار تنظیم شماره کارت</div><div style="text-align:center;color:var(--muted)" id="cardName"></div></div><form id="paymentForm"><div class="field" style="margin-top:16px"><label>کد پیگیری / شماره تراکنش *</label><input name="reference" required></div><button class="btn" type="submit">ثبت اطلاعات پرداخت</button></form><div id="paymentResult" class="success hidden"></div></section></div></main><script>
const nf=new Intl.NumberFormat('fa-IR');let cart=[];let order=null;const fmt=n=>nf.format(n)+' تومان';
function load(){try{cart=JSON.parse(localStorage.getItem('avan_cart_v55')||'[]')}catch{cart=[]}return cart}
async function products(){const r=await fetch('/api/products',{cache:'no-store'});const d=await r.json();const map=new Map((d.products||[]).map(p=>[String(p.id),p]));return load().map(x=>{const p=map.get(String(x.id));return p?{...p,qty:Math.max(1,Number(x.qty)||1)}:null}).filter(Boolean)}
function render(){const el=document.getElementById('items');const total=document.getElementById('total');let sum=0;if(!cart.length){el.innerHTML='<p style="color:#f0b6b6">سبد خرید خالی است.</p>';return}el.innerHTML=cart.map(x=>{const line=Number(x.price)*x.qty;sum+=line;return `<div class="summary-item"><span>${x.name} × ${nf.format(x.qty)}</span><b>${fmt(line)}</b></div>`}).join('');total.textContent=fmt(sum)}
(async()=>{cart=await products();render();if(!cart.length)document.querySelector('#checkoutForm .btn').disabled=true;})();
document.getElementById('checkoutForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;const f=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items:cart.map(x=>({id:x.id,qty:x.qty})),customer:f})});const d=await r.json();if(!r.ok)throw new Error(d.error||'ثبت سفارش ناموفق بود');order=d.order;document.getElementById('paymentCard').classList.remove('hidden');document.getElementById('cardNumber').textContent=order.payment?.cardNumber||'شماره کارت در تنظیمات Cloudflare وارد نشده';document.getElementById('cardName').textContent=order.payment?.cardName||'';document.getElementById('paymentText').innerHTML=`شماره سفارش: <b class="order-id">${order.id}</b><br>مبلغ قابل پرداخت: <b class="gold">${fmt(order.total)}</b>`;localStorage.removeItem('avan_cart_v55');e.target.classList.add('hidden');window.scrollTo({top:document.getElementById('paymentCard').offsetTop-20,behavior:'smooth'});}catch(err){alert(err.message)}finally{btn.disabled=false}});
document.getElementById('paymentForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const f=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/orders/'+encodeURIComponent(order.id)+'/payment',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(f)});const d=await r.json();if(!r.ok)throw new Error(d.error||'خطا');document.getElementById('paymentResult').classList.remove('hidden');document.getElementById('paymentResult').innerHTML=`<h3>پرداخت برای بررسی ثبت شد ✅</h3><p>شماره سفارش</p><div class="order-id">${order.id}</div><p style="color:var(--muted)">بعد از تأیید پرداخت، سفارش وارد مرحله پردازش می‌شود.</p>`;e.target.classList.add('hidden');}catch(err){alert(err.message)}finally{btn.disabled=false}});
</script></body></html>

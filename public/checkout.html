<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-avan.png">
<link rel="apple-touch-icon" href="/assets/favicon-avan.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>ثبت سفارش | AVAN GALLERY</title><link rel="stylesheet" href="/style.css"><style>
:root{--navy:#03131d;--navy2:#082433;--navy3:#0d3042;--gold:#e9c15d;--gold2:#f5d77f;--text:#f5f7f8;--muted:#9fb2bb;--muted2:#78919d;--line:rgba(255,255,255,.09);--line2:rgba(233,193,93,.22);--success:#72d5a0}
*{box-sizing:border-box}html{min-height:100%;background:#020b12}body{margin:0;min-height:100%;background:radial-gradient(900px 420px at 50% -80px,rgba(22,83,108,.65),transparent 65%),linear-gradient(180deg,#061b28 0%,#03131d 48%,#020c13 100%);color:var(--text);font-family:"Vazirmatn",Tahoma,sans-serif;font-size:14px;line-height:1.85;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button,input,textarea{font-family:inherit}.checkout-wrap{width:min(1180px,100%);margin:0 auto;padding:30px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.brand-line{display:flex;align-items:center;gap:12px}.brand-logo{width:46px;height:46px;object-fit:contain;border-radius:50%;padding:5px;background:#041824;border:1px solid var(--line2);box-shadow:0 8px 28px #0005}.brand{color:var(--gold2);font-family:Arial,sans-serif;font-weight:800;letter-spacing:2.8px;font-size:14px;direction:ltr}.top h1{margin:2px 0 0;font-size:28px;line-height:1.35;font-weight:900}.back{display:inline-flex;align-items:center;gap:7px;color:#e8eef0;text-decoration:none;border:1px solid #23495b;background:rgba(5,25,37,.75);padding:10px 15px;border-radius:12px;font-weight:700;transition:.2s}.back:hover{border-color:var(--gold);color:var(--gold2);transform:translateY(-1px)}.grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(330px,.82fr);gap:18px;align-items:start}.card{background:linear-gradient(145deg,rgba(8,31,44,.96),rgba(4,21,31,.96));border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 22px 65px rgba(0,0,0,.27),inset 0 1px 0 rgba(255,255,255,.025)}.card h2{margin:0 0 18px;font-size:19px;font-weight:900;line-height:1.5}.step{display:inline-flex;align-items:center;padding:6px 11px;font-weight:800;border-radius:999px;background:rgba(233,193,93,.08);border:1px solid var(--line2);color:var(--gold2);font-size:10px;margin-bottom:11px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;color:#b9c7cc;margin:0 0 6px}.field input,.field textarea{width:100%;background:#061a26;border:1px solid #244a5d;color:#fff;border-radius:11px;padding:12px 13px;outline:none;font:inherit;font-size:13px;line-height:1.7;transition:.2s;box-shadow:inset 0 1px 8px rgba(0,0,0,.12)}.field input::placeholder,.field textarea::placeholder{color:#5e7884}.field input:focus,.field textarea:focus{border-color:rgba(233,193,93,.75);box-shadow:0 0 0 3px rgba(233,193,93,.07),inset 0 1px 8px rgba(0,0,0,.12)}.field textarea{min-height:96px;resize:vertical}.btn{width:100%;margin-top:17px;border:0;border-radius:12px;background:linear-gradient(135deg,#f2cf72,#dcae42);color:#07141c;font:900 13px Vazirmatn;padding:14px 16px;cursor:pointer;box-shadow:0 12px 28px rgba(218,170,63,.16);transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 15px 32px rgba(218,170,63,.24)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.summary-card{position:sticky;top:18px}.summary-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}.secure{font-size:9px;color:var(--success);border:1px solid rgba(114,213,160,.22);background:rgba(114,213,160,.06);padding:5px 8px;border-radius:999px}.summary-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:11px;color:#dce5e8}.summary-item b{color:#fff;font-size:11px;white-space:nowrap}.total{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:17px;font-weight:900;font-size:16px}.gold{color:var(--gold2)}.payment{margin-top:16px;padding:17px;border-radius:15px;background:linear-gradient(145deg,rgba(233,193,93,.09),rgba(233,193,93,.025));border:1px solid var(--line2)}.payment .num{direction:ltr;text-align:center;font-size:21px;font-weight:900;letter-spacing:2px;margin:10px 0;color:var(--gold2)}.hidden{display:none!important}.success{padding:28px;text-align:center}.order-id{direction:ltr;unicode-bidi:isolate;font-weight:900;color:var(--gold2);font-size:20px}.empty{padding:18px 0;color:#e2a1a1;font-size:11px;text-align:center}@media(max-width:800px){.checkout-wrap{padding:20px 12px 50px}.top{align-items:flex-start}.top h1{font-size:23px}.brand-logo{width:40px;height:40px}.back{font-size:10px;padding:9px 11px}.grid{grid-template-columns:1fr}.summary-card{position:static;order:2}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:17px;border-radius:17px}}@media(max-width:480px){.top{flex-direction:column}.back{align-self:flex-start}.top h1{font-size:21px}.brand{font-size:12px}.fields{gap:10px}.field input,.field textarea{font-size:12px;padding:11px}.btn{padding:13px}}

</style></head><body><main class="checkout-wrap"><div class="top"><div class="brand-line"><img class="brand-logo" src="/assets/favicon-avan.png" alt="آوان گالری"><div><div class="brand">AVAN GALLERY</div><h1>ثبت سفارش</h1></div></div><a class="back" href="/">← بازگشت به فروشگاه</a></div><div id="app"><div class="grid"><section class="card"><span class="step">مرحله ۱ · اطلاعات ارسال</span><h2>اطلاعات گیرنده</h2><form id="checkoutForm"><div class="fields"><div class="field"><label>نام و نام خانوادگی *</label><input name="name" required></div><div class="field"><label>شماره موبایل *</label><input name="phone" inputmode="tel" required></div><div class="field"><label>ایمیل</label><input name="email" type="email"></div><div class="field"><label>استان *</label><input name="province" required></div><div class="field"><label>شهر *</label><input name="city" required></div><div class="field"><label>کد پستی</label><input name="postalCode" inputmode="numeric"></div><div class="field full"><label>آدرس کامل *</label><textarea name="address" required></textarea></div><div class="field full"><label>توضیحات سفارش</label><textarea name="notes" placeholder="مثلاً زمان مناسب تحویل..."></textarea></div></div><button class="btn" type="submit">ادامه و ثبت سفارش</button></form></section><aside class="card summary-card"><div class="summary-head"><span class="step">خلاصه سفارش</span><span class="secure">✓ خرید امن</span></div><div id="items"></div><div class="total"><span>مبلغ نهایی</span><strong id="total" class="gold">۰ تومان</strong></div></aside></div><section id="paymentCard" class="card hidden" style="margin-top:20px"><span class="step">مرحله ۲ · پرداخت کارت به کارت</span><h2>پرداخت سفارش</h2><p id="paymentText" style="color:var(--muted);line-height:2">سفارش شما ثبت شد. مبلغ را به کارت زیر واریز کنید، سپس کد پیگیری تراکنش را وارد کنید.</p><div class="payment"><div>شماره کارت</div><div id="cardNumber" class="num">در انتظار تنظیم شماره کارت</div><div style="text-align:center;color:var(--muted)" id="cardName"></div></div><form id="paymentForm"><div class="field" style="margin-top:16px"><label>کد پیگیری / شماره تراکنش *</label><input name="reference" required></div><button class="btn" type="submit">ثبت اطلاعات پرداخت</button></form><div id="paymentResult" class="success hidden"></div></section></div></main><script>
const nf=new Intl.NumberFormat('fa-IR');let cart=[];let order=null;const fmt=n=>nf.format(n)+' تومان';
function load(){try{cart=JSON.parse(localStorage.getItem('avan_cart_v55')||'[]')}catch{cart=[]}return cart}
async function products(){const r=await fetch('/api/products',{cache:'no-store'});const d=await r.json();const map=new Map((d.products||[]).map(p=>[String(p.id),p]));return load().map(x=>{const p=map.get(String(x.id));return p?{...p,qty:Math.max(1,Number(x.qty)||1)}:null}).filter(Boolean)}
function render(){const el=document.getElementById('items');const total=document.getElementById('total');let sum=0;if(!cart.length){el.innerHTML='<div class="empty">سبد خرید شما خالی است.</div>';return}el.innerHTML=cart.map(x=>{const line=Number(x.price)*x.qty;sum+=line;return `<div class="summary-item"><span>${x.name} × ${nf.format(x.qty)}</span><b>${fmt(line)}</b></div>`}).join('');total.textContent=fmt(sum)}
(async()=>{cart=await products();render();if(!cart.length)document.querySelector('#checkoutForm .btn').disabled=true;})();
document.getElementById('checkoutForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;const f=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items:cart.map(x=>({id:x.id,qty:x.qty})),customer:f})});const d=await r.json();if(!r.ok)throw new Error(d.error||'ثبت سفارش ناموفق بود');order=d.order;document.getElementById('paymentCard').classList.remove('hidden');document.getElementById('cardNumber').textContent=order.payment?.cardNumber||'شماره کارت در تنظیمات Cloudflare وارد نشده';document.getElementById('cardName').textContent=order.payment?.cardName||'';document.getElementById('paymentText').innerHTML=`شماره سفارش: <b class="order-id">${order.id}</b><br>مبلغ قابل پرداخت: <b class="gold">${fmt(order.total)}</b>`;localStorage.removeItem('avan_cart_v55');e.target.classList.add('hidden');window.scrollTo({top:document.getElementById('paymentCard').offsetTop-20,behavior:'smooth'});}catch(err){alert(err.message)}finally{btn.disabled=false}});
document.getElementById('paymentForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const f=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/orders/'+encodeURIComponent(order.id)+'/payment',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(f)});const d=await r.json();if(!r.ok)throw new Error(d.error||'خطا');document.getElementById('paymentResult').classList.remove('hidden');document.getElementById('paymentResult').innerHTML=`<h3>پرداخت برای بررسی ثبت شد ✅</h3><p>شماره سفارش</p><div class="order-id">${order.id}</div><p style="color:var(--muted)">بعد از تأیید پرداخت، سفارش وارد مرحله پردازش می‌شود.</p>`;e.target.classList.add('hidden');}catch(err){alert(err.message)}finally{btn.disabled=false}});
</script></body></html>

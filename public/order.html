<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیگیری سفارش | آوان</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/"><b>آوان</b><small>AVAN GALLERY</small></a><nav><a href="/">فروشگاه</a><a href="/account.html">حساب من</a></nav></header><main class="section"><div id="orderBox" class="box static">در حال بارگذاری...</div></main><script>
const fa=n=>Number(n||0).toLocaleString("fa-IR"),money=n=>fa(n)+" تومان";async function api(p){const r=await fetch(p);const d=await r.json();if(!r.ok)throw Error(d.error||"خطا");return d}(async()=>{try{const o=await api("/api/orders/"+new URLSearchParams(location.search).get("id"));orderBox.innerHTML='<h2>سفارش '+o.order_number+'</h2><div class="track"><b class="'+(o.status!=="cancelled"?"on":"")+'">ثبت سفارش</b><b class="'+(["processing","shipped","delivered"].includes(o.status)?"on":"")+'">در حال آماده‌سازی</b><b class="'+(["shipped","delivered"].includes(o.status)?"on":"")+'">ارسال شده</b><b class="'+(o.status==="delivered"?"on":"")+'">تحویل شده</b></div><p>مبلغ: <b>'+money(o.total)+'</b></p><p>وضعیت پرداخت: '+o.payment_status+'</p><p>کد رهگیری: '+(o.tracking_code||"هنوز ثبت نشده")+'</p><h3>اقلام سفارش</h3>'+o.items.map(x=>'<div class="order"><span>'+x.product_name+'</span><span>'+fa(x.qty)+' عدد</span><b>'+money(x.price*x.qty)+'</b></div>').join("")}catch(e){orderBox.innerHTML=e.message}})();
</script></body></html>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محصول | AVAN GALLERY</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/"><b>آوان</b><small>AVAN GALLERY</small></a><nav><a href="/">صفحه اصلی</a><a href="/#products">محصولات</a><a href="/account.html">حساب من</a></nav></header><main class="section" id="detail"></main><script>
const id=new URLSearchParams(location.search).get("id");
const money=n=>Number(n||0).toLocaleString("fa-IR")+" تومان";
async function api(p,o={}){const r=await fetch(p,{...o,headers:{"content-type":"application/json"}});const d=await r.json();if(!r.ok)throw Error(d.error||"خطا");return d}
(async()=>{try{const p=await api("/api/products/"+id);const pics=[p.image,...(p.gallery||[])].filter(Boolean);detail.innerHTML=\`
<div class="productDetail"><div class="detailGallery"><img id="mainPic" src="\${pics[0]||""}">\${pics.length>1?'<div class="thumbs">'+pics.map(x=>'<img onclick="mainPic.src=\\''+x+'\\'" src="'+x+'">').join("")+"</div>":""}</div><div class="detailInfo"><small>\${p.brand}</small><h1>\${p.name}</h1><p>\${p.description||"ساعت منتخب آوان گالری با طراحی خاص و کیفیت ممتاز."}</p><h2>\${money(p.price)}</h2><div class="stock">\${p.stock>0?"موجود در انبار":"ناموجود"}</div><button class="pay" onclick="add(\${p.id})" \${p.stock<1?"disabled":""}>افزودن به سبد خرید</button></div></div>\`;window.add=async id=>{const m=await api("/api/auth/me");if(!m.user)return location.href="/?login=1";let c=await api("/api/cart");let items=c.items||[],x=items.find(a=>a.productId===id);x?x.qty++:items.push({productId:id,qty:1});await api("/api/cart",{method:"POST",body:JSON.stringify({items}));alert("به سبد خرید اضافه شد")}}catch(e){detail.innerHTML='<div class="empty">'+e.message+"</div>"}})();
</script></body></html>
